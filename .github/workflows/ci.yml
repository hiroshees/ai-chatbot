name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # postinstall で prisma generate が走る
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # テストとあわせてカバレッジをログに出力する（最低ラインでの失敗判定はしない）
      - run: pnpm test:coverage

      # ビルドにシークレットは使わない（DB・Gemini への実接続は行わない）
      - run: pnpm build
